name: SEO foundation checks
on:
  pull_request:
    paths:
      - 'index.html'
      - 'alex/collections.py'
      - 'alex/taxonomy.py'
      - 'alex/pipelines/classify.py'
      - 'alex/pipelines/publish.py'
      - 'config/research_collections.json'
      - 'research/**'
      - 'assets/**'
      - 'data/papers.json'
      - 'data/accepted_classified.csv'
      - 'scripts/stage_site.py'
      - 'scripts/check_collection_layouts.py'
      - 'tests/test_collections.py'
      - 'tests/test_pipelines.py'
      - 'tests/test_apwg_import.py'
      - 'tests/conftest.py'
      - '.github/workflows/publish.yml'
      - '.github/workflows/rebuild_site.yml'
      - '.github/workflows/apwg_approved_release.yml'
      - '.github/workflows/apwg_import_tests.yml'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'scripts/check_seo.py'
      - '.github/workflows/pages.yml'
      - '.github/workflows/pipeline.yml'
      - '.github/workflows/seo_foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test collections and publishing
        run: python -m pytest tests/test_collections.py tests/test_pipelines.py tests/test_apwg_import.py -q
      - name: Check committed generation
        run: python -m alex.collections --check
      - name: Generate and validate the actual Pages artifact (no deployment)
        run: python scripts/stage_site.py
      - name: Prepare isolated layout-test browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify every collection layout and existing search
        run: python scripts/check_collection_layouts.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alex-layout-review
          path: _layout_review
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: alex-collections-preview
          path: _site
          retention-days: 14
