name: Discover
on:
  workflow_dispatch:
env:
  ALEX_OPENALEX_STATE_PATH: data/discovery_openalex_state.json
  ALEX_DISCOVERY_SYNC: "1"
permissions:
  contents: write
# Shares the Pipeline's group: these jobs read and write the same
# pipeline-state branch, so a manual run must not interleave with it.
concurrency:
  group: pipeline
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: scripts/state.sh pull
      - env:
          HARVEST_MAILTO: ${{ secrets.HARVEST_MAILTO }}
          CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=0
          python -m alex.cli discover || status=$?
          scripts/state.sh push "Checkpoint weekly discovery (exit $status)"
          if [ -f data/discovery_run_receipt.json ]; then
            python -c 'import json; r=json.load(open("data/discovery_run_receipt.json")); print("Discovery coverage: " + r["status"] + "; actual requests: " + str(r["actual_request_count"]))' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
