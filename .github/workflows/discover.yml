name: Discover
on:
  workflow_dispatch:
env:
  ALEX_OPENALEX_STATE_PATH: data/discovery_openalex_state.json
  ALEX_DISCOVERY_SYNC: "1"
permissions:
  contents: write
# Shares the Pipeline's group: these jobs read and write the same
# pipeline-state branch, so a manual run must not interleave with it.
concurrency:
  group: pipeline
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: scripts/state.sh pull
      - env:
          HARVEST_MAILTO: ${{ secrets.HARVEST_MAILTO }}
          CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m alex.pipelines.discovery_recovery
      - name: Preserve discovery recovery evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: discovery-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/discovery_recovery_receipt.json
            data/discovery_recovery_ledger.json
            data/discovery_run_receipt.json
            data/discovery_recovery_startup_error.json
          if-no-files-found: warn
