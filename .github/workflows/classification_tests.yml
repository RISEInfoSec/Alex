name: Classification regression checks
on:
  pull_request:
    paths:
      - 'alex/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/classification_tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python scripts/run_offline_tests.py -m pytest -q -W error::FutureWarning
