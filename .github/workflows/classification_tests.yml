name: Classification regression checks
on:
  pull_request:
    paths:
      - 'alex/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/classification_tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
