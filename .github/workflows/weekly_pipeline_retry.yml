name: ALEX one-off weekly retry
on:
  push:
    branches: [main]
    paths: ['config/weekly_pipeline_retry_request.json']
permissions:
  contents: read
  actions: write
concurrency:
  group: alex-one-off-weekly-retry
  cancel-in-progress: false
jobs:
  launch:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Verify supersession and dispatch one current-main pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/weekly_retry.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: weekly-retry-${{ github.run_id }}
          path: .cache/weekly-retry-receipt.json
          if-no-files-found: error
