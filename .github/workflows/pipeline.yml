name: Pipeline
on:
  workflow_dispatch:
    inputs:
      resume_completed_discovery_run:
        description: 'Prior run blocked only by the known completed-receipt rounding defect; replay with zero requests'
        type: string
        required: false
        default: ''
  schedule:
    - cron: "23 3 * * 1"
env:
  ALEX_OPENALEX_STATE_PATH: data/discovery_openalex_state.json
  ALEX_DISCOVERY_SYNC: "1"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pipeline
  cancel-in-progress: false

# Each stage is its own job so it gets its own 6h GitHub Actions ceiling. The
# old single-job layout hit the 6h wall mid-Harvest on 2026-04-27 (issue #62)
# and lost Harvest/Rescore/Classify/Publish for the week. `needs:` chaining
# inside one workflow has no cascade cap (the 3-level cap only applies to
# `workflow_run` triggers across separate workflows), so we can chain freely.
#
# Each stage commits and pushes its output to main, then the next job runs a
# fresh `actions/checkout` against `ref: main` to pick up that push (the
# default checkout ref is the trigger SHA, which is stale once a prior job
# has pushed). `.rescore_window.json` is committed by the rescore stage so
# classify can read it from the next runner's disk.
#
# Intermediate working files (discovery_candidates, quality_metrics,
# rejected_candidates, accepted_candidates, rescore_metrics) are NOT on main:
# they outgrew GitHub's 100 MiB file limit and blocked every push from
# 2026-07-13. They live gzipped on the `pipeline-state` branch; jobs move
# them with `scripts/state.sh pull|push`.
#
# Discovery has a four-hour controller deadline and a five-hour job ceiling,
# with each pass still capped at45 minutes. Other stages retain their original
# shorter ceilings. The `report` job always runs last and opens/closes a
# failure issue; it does not change workflow scheduling state.
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Pull pipeline state
        run: scripts/state.sh pull
      - name: Verify prior checkpoint state before discovery
        run: python -m scripts.pipeline_preflight
      - name: Discover
        env:
          ALEX_RESUME_DISCOVERY_RUN: ${{ inputs.resume_completed_discovery_run }}
          HARVEST_MAILTO: ${{ secrets.HARVEST_MAILTO }}
          CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m alex.pipelines.discovery_recovery
      - name: Preserve discovery recovery evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: discovery-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/discovery_recovery_receipt.json
            data/discovery_recovery_ledger.json
            data/discovery_run_receipt.json
            data/discovery_recovery_startup_error.json
          if-no-files-found: warn

  chain:
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Pull pipeline state
        id: pipeline_state
        run: scripts/state.sh pull
      - name: Fence citation attempt
        id: citation_fence
        run: |
          python scripts/citation_guard.py begin
          scripts/state.sh push "Fence citation attempt"
          python scripts/citation_guard.py acknowledge
      - name: Citation chain
        id: citation_chain
        env:
          HARVEST_MAILTO: ${{ secrets.HARVEST_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          python -m alex.cli chain
      - name: Retain citation response evidence
        id: citation_evidence
        if: ${{ always() && steps.citation_chain.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: citation-responses-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/citation_response_evidence-*.jsonl
          if-no-files-found: error
      - name: Retain staged citation output
        if: ${{ always() && steps.citation_chain.outcome == 'failure' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: citation-staged-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/.citation-*.tmp
          include-hidden-files: true
          if-no-files-found: warn
      - name: Preserve completed candidates and provider cooldown
        if: ${{ always() && steps.pipeline_state.outcome == 'success' && steps.citation_chain.outcome == 'success' && steps.citation_evidence.outcome == 'success' }}
        run: |
          python scripts/citation_guard.py complete
          scripts/state.sh push "Preserve chain state and provider cooldown"
      - name: Preserve provider cooldown after incomplete chain
        if: ${{ always() && steps.pipeline_state.outcome == 'success' && steps.citation_fence.outcome == 'success' && (steps.citation_chain.outcome != 'success' || steps.citation_evidence.outcome != 'success') }}
        run: scripts/state.sh push-provider "Preserve provider cooldown after incomplete chain"

  score:
    needs: chain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Pull pipeline state
        run: scripts/state.sh pull
      - name: Quality gate
        run: |
          python scripts/citation_guard.py quality-begin
          python -m alex.cli score
          python scripts/citation_guard.py quality-complete
          scripts/state.sh push "Quality gate results"
          git add data/review_queue.csv
          git diff --cached --quiet || git commit -m "Quality gate results"
          git push || (git pull --rebase --autostash && git push)

  harvest:
    needs: score
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Pull pipeline state
        id: pipeline_state
        run: scripts/state.sh pull
      - name: Harvest
        env:
          HARVEST_MAILTO: ${{ secrets.HARVEST_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          python -m alex.cli harvest
          git add data/accepted_harvested.csv
          git diff --cached --quiet || git commit -m "Harvest metadata"
          git push || (git pull --rebase --autostash && git push)
      # Harvest's client performs initial, periodic and final state syncs.
      # Do not automatically retry a failed or ambiguous checkpoint push.
      - name: Retain harvest response evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: harvest-responses-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/harvest_response_cache*.jsonl
            data/harvest_response_cache*.uncertain
            data/.harvest-pending-*.csv
            data/.harvest-prior-*.csv
            data/discovery_openalex_state.json
          include-hidden-files: true
          if-no-files-found: warn

  rescore:
    needs: harvest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Pull pipeline state
        run: scripts/state.sh pull
      - name: Rescore
        run: |
          set -o pipefail
          SUMMARY=$(python -m alex.cli rescore | tail -n1)
          echo "$SUMMARY"
          # .rescore_window.json carries the run_id classify uses to drop
          # demoted papers from the existing corpus. Across separate jobs
          # (separate runners, no shared disk), the file MUST be committed
          # so the classify job can read it after its fresh checkout. Use
          # -A so an empty-input rescore that unlinked the file also stages
          # the deletion.
          scripts/state.sh push "Post-harvest rescore: ${SUMMARY:-no summary}"
          git add data/accepted_harvested.csv
          if [ -e data/.harvest_output_lineage.json ]; then
            git add data/.harvest_output_lineage.json
          fi
          if [ -e data/.rescore_window.json ] || git ls-files --error-unmatch data/.rescore_window.json >/dev/null 2>&1; then
            git add -A data/.rescore_window.json
          fi
          git diff --cached --quiet || git commit -m "Post-harvest rescore: ${SUMMARY:-no summary}"
          git push || (git pull --rebase --autostash && git push)

  classify:
    needs: rescore
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Pull pipeline state
        run: scripts/state.sh pull
      - name: Classify
        env:
          OPENAI_API_KEY: ${{ secrets.OPEN_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
        run: |
          python -m alex.cli classify
          # classify.py unlinks .rescore_window.json after using it; stage
          # the deletion so a stale token doesn't persist into next week.
          git add data/accepted_classified.csv
          if [ -e data/.rescore_window.json ] || git ls-files --error-unmatch data/.rescore_window.json >/dev/null 2>&1; then
            git add -A data/.rescore_window.json
          fi
          git diff --cached --quiet || git commit -m "Classify accepted papers"
          git push || (git pull --rebase --autostash && git push)
      - name: Retain paid request evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: classification-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/classification_request_ledger.json
          if-no-files-found: warn

  apwg:
    # Review-only: do not automatically add an unclassified research corpus.
    # This job intentionally does not modify accepted_classified.csv.
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Pull pipeline state
        id: pipeline_state
        run: scripts/state.sh pull
      - name: Read-only APWG audit
        env:
          HARVEST_MAILTO: ${{ secrets.HARVEST_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          set -o pipefail
          mkdir -p .cache
          python -m alex.cli apwg --dry-run | tee .cache/apwg-audit.json
      - name: Preserve APWG provider cooldown
        if: ${{ always() && steps.pipeline_state.outcome == 'success' }}
        run: scripts/state.sh push "Preserve APWG provider cooldown"
      - name: Retain APWG audit and provider state
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: apwg-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/apwg-audit.json
            data/discovery_openalex_state.json
          if-no-files-found: warn

  publish:
    needs: apwg
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish
        run: |
          python -m alex.cli publish --record-collection
          git add -A research sitemap.xml
          git add data/osint_cyber_papers.csv data/papers.json data/collection_status.json
          git diff --cached --quiet || git commit -m "Publish public corpus"
          git push || (git pull --rebase --autostash && git push)

  deploy:
    # Pages deploy runs after publish. Use ref: main so we pick up the
    # commits each prior job pushed during this run; the default trigger
    # SHA is from before discover ran and would stage a stale corpus
    # (observed 2026-04-25 with the old layout: site stuck at 256 papers
    # while main was at 394).
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          # Keep website implementation history separate from corpus updates.
          fetch-depth: 0
          filter: blob:none
      - name: Generate and validate Pages artifact
        run: |
          revision="$(git rev-parse --verify HEAD)"
          python3 scripts/stage_site.py --revision "$revision"
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - uses: actions/deploy-pages@v5.0.1

  report:
    # Runs after every run, whatever happened upstream.
    #  - Alert: a failed or cancelled stage opens an issue (or comments on
    #    the open one), so watchers hear about the first failure, not the
    #    tenth. The next clean run closes it.
    needs: [discover, chain, score, harvest, rescore, classify, apwg, publish, deploy]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NEEDS: ${{ toJSON(needs) }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open, update or close the failure issue
        run: |
          label=pipeline-failure
          gh label create "$label" --color B60205 \
            --description "Scheduled pipeline run failed" 2>/dev/null || true
          bad=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled")
                       | "- `\(.key)`: \(.value.result)"' <<<"$NEEDS")
          open=$(gh issue list --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$bad" ]; then
            body=$(printf 'Pipeline run failed: %s\n\n%s\n' "$RUN_URL" "$bad")
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "$body"
            else
              gh issue create --label "$label" --title "Pipeline failing" --body "$body"
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Recovered: $RUN_URL"
          fi
