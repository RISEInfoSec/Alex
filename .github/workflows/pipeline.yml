name: Pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pipeline
  cancel-in-progress: false

# Each stage is its own job so it gets its own 6h GitHub Actions ceiling. The
# old single-job layout hit the 6h wall mid-Harvest on 2026-04-27 (issue #62)
# and lost Harvest/Rescore/Classify/Publish for the week. `needs:` chaining
# inside one workflow has no cascade cap (the 3-level cap only applies to
# `workflow_run` triggers across separate workflows), so we can chain freely.
#
# Each stage commits and pushes its output to main, then the next job runs a
# fresh `actions/checkout` against `ref: main` to pick up that push (the
# default checkout ref is the trigger SHA, which is stale once a prior job
# has pushed). `.rescore_window.json` is committed by the rescore stage so
# classify can read it from the next runner's disk.
#
# Intermediate working files (discovery_candidates, quality_metrics,
# rejected_candidates, accepted_candidates, rescore_metrics) are NOT on main:
# they outgrew GitHub's 100 MiB file limit and blocked every push from
# 2026-07-13. They live gzipped on the `pipeline-state` branch; jobs move
# them with `scripts/state.sh pull|push`.
#
# Every job has a timeout-minutes well under the 6h ceiling so a stalled
# upstream costs an hour, not the whole run (chain hung 6h on 2026-06-22,
# 06-29 and 07-20). The `report` job always runs last: it keeps the schedule
# from being auto-disabled and opens/closes a failure issue.
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Pull pipeline state
        run: scripts/state.sh pull
      - name: Discover
        env:
          HARVEST_MAILTO: ${{ secrets.HARVEST_MAILTO }}
          CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m alex.cli discover
          scripts/state.sh push "Discover candidates"

  chain:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Pull pipeline state
        run: scripts/state.sh pull
      - name: Citation chain
        env:
          HARVEST_MAILTO: ${{ secrets.HARVEST_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          python -m alex.cli chain
          scripts/state.sh push "Citation chain candidates"

  score:
    needs: chain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Pull pipeline state
        run: scripts/state.sh pull
      - name: Quality gate
        run: |
          python -m alex.cli score
          scripts/state.sh push "Quality gate results"
          git add data/review_queue.csv
          git diff --cached --quiet || git commit -m "Quality gate results"
          git push || (git pull --rebase --autostash && git push)

  harvest:
    needs: score
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Pull pipeline state
        run: scripts/state.sh pull
      - name: Harvest
        env:
          HARVEST_MAILTO: ${{ secrets.HARVEST_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          python -m alex.cli harvest
          git add data/accepted_harvested.csv
          git diff --cached --quiet || git commit -m "Harvest metadata"
          git push || (git pull --rebase --autostash && git push)

  rescore:
    needs: harvest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Pull pipeline state
        run: scripts/state.sh pull
      - name: Rescore
        run: |
          SUMMARY=$(python -m alex.cli rescore | tail -n1)
          echo "$SUMMARY"
          # .rescore_window.json carries the run_id classify uses to drop
          # demoted papers from the existing corpus. Across separate jobs
          # (separate runners, no shared disk), the file MUST be committed
          # so the classify job can read it after its fresh checkout. Use
          # -A so an empty-input rescore that unlinked the file also stages
          # the deletion.
          scripts/state.sh push "Post-harvest rescore: ${SUMMARY:-no summary}"
          git add data/accepted_harvested.csv
          git add -A data/.rescore_window.json
          git diff --cached --quiet || git commit -m "Post-harvest rescore: ${SUMMARY:-no summary}"
          git push || (git pull --rebase --autostash && git push)

  classify:
    needs: rescore
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Pull pipeline state
        run: scripts/state.sh pull
      - name: Classify
        env:
          OPENAI_API_KEY: ${{ secrets.OPEN_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
        run: |
          python -m alex.cli classify
          # classify.py unlinks .rescore_window.json after using it; stage
          # the deletion so a stale token doesn't persist into next week.
          git add data/accepted_classified.csv
          git add -A data/.rescore_window.json
          git diff --cached --quiet || git commit -m "Classify accepted papers"
          git push || (git pull --rebase --autostash && git push)

  publish:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish
        run: |
          python -m alex.cli publish
          git add data/osint_cyber_papers.csv data/papers.json
          git diff --cached --quiet || git commit -m "Publish public corpus"
          git push || (git pull --rebase --autostash && git push)

  deploy:
    # Pages deploy runs after publish. Use ref: main so we pick up the
    # commits each prior job pushed during this run; the default trigger
    # SHA is from before discover ran and would stage a stale corpus
    # (observed 2026-04-25 with the old layout: site stuck at 256 papers
    # while main was at 394).
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Stage site files
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/papers.json _site/data/
          cp data/osint_cyber_papers.csv _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4

  report:
    # Runs after every run, whatever happened upstream.
    #  - Keepalive: GitHub disables a schedule after 60 days without repo
    #    activity. Every run failed before committing from 2026-07-20, so
    #    both schedules were auto-disabled by 2026-09-28 and the failures
    #    went unseen. Re-enabling via the API resets that timer.
    #  - Alert: a failed or cancelled stage opens an issue (or comments on
    #    the open one), so watchers hear about the first failure, not the
    #    tenth. The next clean run closes it.
    needs: [discover, chain, score, harvest, rescore, classify, publish, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NEEDS: ${{ toJSON(needs) }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Keep schedules enabled
        run: |
          for wf in pipeline.yml discover_manual_assist.yml; do
            gh api -X PUT "repos/$GH_REPO/actions/workflows/$wf/enable"
          done
      - name: Open, update or close the failure issue
        run: |
          label=pipeline-failure
          gh label create "$label" --color B60205 \
            --description "Scheduled pipeline run failed" 2>/dev/null || true
          bad=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled")
                       | "- `\(.key)`: \(.value.result)"' <<<"$NEEDS")
          open=$(gh issue list --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$bad" ]; then
            body=$(printf 'Pipeline run failed: %s\n\n%s\n' "$RUN_URL" "$bad")
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "$body"
            else
              gh issue create --label "$label" --title "Pipeline failing" --body "$body"
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Recovered: $RUN_URL"
          fi
