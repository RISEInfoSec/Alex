name: Restore November 24 discovery state
on:
  push:
    branches: ['maintenance/restore-weekly-20261124-2ae64e67f2d2']
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 2ae64e67f2d226048d70f7d6ad63e3ab2e510a90
          fetch-depth: 1
          persist-credentials: false
      - name: Verify every restored Git blob and compressed file
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2ae64e67f2d226048d70f7d6ad63e3ab2e510a90
          test "$(git rev-parse 'HEAD^{tree}')" = e6d2dd65054ce9cadd53697583f4da67a13dee28
          for f in discovery_checkpoint.json.gz discovery_candidates.csv.gz discovery_run_receipt.json.gz series_window.json.gz; do
            test "$(git hash-object "$f")" = "$(git rev-parse "HEAD:$f")"
            gzip -t "$f"
          done
          tar -cf - discovery_checkpoint.json.gz discovery_candidates.csv.gz discovery_run_receipt.json.gz series_window.json.gz | split -b 24M -d --additional-suffix=.bin - part-
          sha256sum part-*.bin
          test "$(ls part-*.bin | wc -l)" -le 4
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ hashFiles('part-00.bin') != '' }}
        with:
          name: restored-2ae64e67f2d2-00
          path: part-00.bin
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ hashFiles('part-01.bin') != '' }}
        with:
          name: restored-2ae64e67f2d2-01
          path: part-01.bin
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ hashFiles('part-02.bin') != '' }}
        with:
          name: restored-2ae64e67f2d2-02
          path: part-02.bin
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ hashFiles('part-03.bin') != '' }}
        with:
          name: restored-2ae64e67f2d2-03
          path: part-03.bin
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
