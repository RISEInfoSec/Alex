name: Restore November 24 discovery state
on:
  push:
    branches: ['maintenance/restore-weekly-20261124-bade02afb2f9']
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: bade02afb2f9566ae6bbc7a9adb3e7ae9cd7be62
          fetch-depth: 1
          persist-credentials: false
      - name: Verify every restored Git blob and compressed file
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = bade02afb2f9566ae6bbc7a9adb3e7ae9cd7be62
          test "$(git rev-parse 'HEAD^{tree}')" = a33ca47d2cf4c636a7ecc5789db96f84229cdfe2
          for f in discovery_checkpoint.json.gz discovery_candidates.csv.gz discovery_run_receipt.json.gz series_window.json.gz; do
            test "$(git hash-object "$f")" = "$(git rev-parse "HEAD:$f")"
            gzip -t "$f"
          done
          tar -cf - discovery_checkpoint.json.gz discovery_candidates.csv.gz discovery_run_receipt.json.gz series_window.json.gz | split -b 24M -d --additional-suffix=.bin - part-
          sha256sum part-*.bin
          test "$(ls part-*.bin | wc -l)" -le 4
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ hashFiles('part-00.bin') != '' }}
        with:
          name: restored-bade02afb2f9-00
          path: part-00.bin
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ hashFiles('part-01.bin') != '' }}
        with:
          name: restored-bade02afb2f9-01
          path: part-01.bin
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ hashFiles('part-02.bin') != '' }}
        with:
          name: restored-bade02afb2f9-02
          path: part-02.bin
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ hashFiles('part-03.bin') != '' }}
        with:
          name: restored-bade02afb2f9-03
          path: part-03.bin
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
