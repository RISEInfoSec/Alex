name: Private relay identity diagnostic
run-name: ALEX private relay identity diagnostic
on:
  workflow_dispatch:
permissions:
  id-token: write
concurrency:
  group: alex-private-relay-identity-diagnostic
  cancel-in-progress: false
jobs:
  identity:
    runs-on: ubuntu-24.04
    environment: alex-openalex-identity-proof
    timeout-minutes: 2
    steps:
      - name: Verify relay accepts a GitHub-signed diagnostic identity
        env:
          ALEX_RECORDER_RELAY_BEARER: ${{ secrets.ALEX_RECORDER_RELAY_BEARER }}
        run: |
          python - <<'PY'
          import json,os,signal,sys,urllib.parse,urllib.request,urllib.error
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  raise urllib.error.HTTPError(req.full_url,code,'redirect_refused',headers,fp)
          def deadline(*_): raise TimeoutError('deadline')
          def read_json(client,req):
              with client.open(req,timeout=20) as response:
                  if response.status!=200: raise ValueError('unavailable')
                  raw=response.read(32769)
              if len(raw)>32768: raise ValueError('unavailable')
              return json.loads(raw)
          try:
              signal.signal(signal.SIGALRM,deadline);signal.alarm(50)
              relay='https://alex-recorder-relay.neil-schwartzm917549.chatgpt.site/api/private-relay-identity-proof'
              endpoint=urllib.parse.urlsplit(os.environ.get('ACTIONS_ID_TOKEN_REQUEST_URL',''))
              host=(endpoint.hostname or '').lower(); credential=os.environ.get('ACTIONS_ID_TOKEN_REQUEST_TOKEN','')
              bearer=os.environ.get('ALEX_RECORDER_RELAY_BEARER','')
              if (endpoint.scheme!='https' or not host.endswith('.actions.githubusercontent.com') or endpoint.username or
                  endpoint.password or endpoint.fragment or not credential or not bearer or
                  any(c in credential+bearer for c in '\r\n')): raise ValueError('unavailable')
              query=urllib.parse.parse_qsl(endpoint.query,keep_blank_values=True)
              if any(k=='audience' for k,_ in query): raise ValueError('unavailable')
              query.append(('audience',relay))
              url=urllib.parse.urlunsplit((endpoint.scheme,endpoint.netloc,endpoint.path,urllib.parse.urlencode(query),''))
              client=urllib.request.build_opener(NoRedirect())
              issued=read_json(client,urllib.request.Request(url,headers={'Authorization':'Bearer '+credential}))
              token=issued.get('value')
              if not isinstance(token,str) or not token or len(token)>16384: raise ValueError('unavailable')
              request=urllib.request.Request(relay,data=json.dumps({'identity_token':token},separators=(',',':')).encode(),
               method='POST',headers={'OAI-Sites-Authorization':'Bearer '+bearer,'Content-Type':'application/json'})
              result=read_json(client,request)
              if result!={'identity_verified':True,'recorder_schema_ready':True,'provider_hold_active':True,'provider_access_authorized':False,'global_fence_verified':False}:
                  raise ValueError('unavailable')
              print('RELAY_SIGNED_IDENTITY_VERIFIED')
          except BaseException:
              print('RELAY_SIGNED_IDENTITY_UNAVAILABLE')
              sys.exit(1)
          PY
