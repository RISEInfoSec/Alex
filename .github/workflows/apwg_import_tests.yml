name: Private service connectivity diagnostic
run-name: ALEX private service connectivity diagnostic
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: alex-private-service-connectivity-diagnostic
  cancel-in-progress: false
jobs:
  connectivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check the private Site and held policy
        env:
          ALEX_SITE_SERVICE_BEARER: ${{ secrets.ALEX_SITE_SERVICE_BEARER }}
        run: |
          python - <<'PY'
          import json,os,signal,sys,urllib.request,urllib.error
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  raise urllib.error.HTTPError(req.full_url,code,'redirect_refused',headers,fp)
          def deadline(*_):
              raise TimeoutError('deadline')
          try:
              token=os.environ.get('ALEX_SITE_SERVICE_BEARER','')
              if not token or '\n' in token or '\r' in token:
                  raise ValueError('unavailable')
              request=urllib.request.Request('https://alex-research-review.neil-schwartzm917549.chatgpt.site/api/private-openalex-policy-proof',headers={'OAI-Sites-Authorization':'Bearer '+token},method='GET')
              signal.signal(signal.SIGALRM,deadline);signal.alarm(30)
              with urllib.request.build_opener(NoRedirect).open(request,timeout=25) as response:
                  if response.status!=200:
                      raise ValueError('unavailable')
                  raw=response.read(16385)
              if len(raw)>16384:
                  raise ValueError('unavailable')
              result=json.loads(raw)
              if result.get('status')!='verified' or result.get('policy_allows') is not False or result.get('provider_access_authorized') is not False:
                  raise ValueError('unavailable')
              print('PRIVATE_SITE_CONNECTION_VERIFIED_POLICY_HELD')
          except BaseException:
              print('PRIVATE_SITE_CONNECTION_UNAVAILABLE')
              sys.exit(1)
          PY
