name: APWG eCrime import checks
on:
  pull_request:
    paths:
      - 'alex/pipelines/apwg_import.py'
      - 'alex/cli.py'
      - 'alex/pipelines/publish.py'
      - 'index.html'
      - 'tests/test_apwg_import.py'
      - '.github/workflows/pipeline.yml'
      - '.github/workflows/apwg_import_tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_apwg_import.py tests/test_pipelines.py
