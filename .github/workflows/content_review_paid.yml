name: Content Review paid preflight
on:
  push:
    branches: [codex/soups-corpus-review]
    paths: ['config/content_review_paid_requests/*.json']
permissions:
  contents: read
concurrency:
  group: content-review-paid
  cancel-in-progress: false
jobs:
  review-classification:
    if: github.repository == 'RISEInfoSec/Alex' && github.ref == 'refs/heads/codex/soups-corpus-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Test isolated request and artifact contract
        run: python -m pytest -q tests/test_content_review_paid_worker.py
      - name: Classify immutable request and dry-run disposable target record
        env:
          OPENAI_API_KEY: ${{ secrets.OPEN_API_KEY }}
        run: >-
          python -m tools.content_review.paid_worker
          --event "$GITHUB_EVENT_PATH"
          --output .cache/content-review-paid/result.json
      - name: Verify public and pipeline files were not modified
        if: always()
        run: |
          git diff --exit-code -- data alex config .github
          test -z "$(git ls-files --others --exclude-standard -- data alex config .github)"
      - name: Preserve a diagnostic when execution failed before a result was written
        if: failure()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('.cache/content-review-paid/result.json')
          if not path.exists():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps({'status': 'failed_before_result', 'provider_attempt_status': 'unknown', 'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'commit': os.environ['GITHUB_SHA'], 'reason': 'Execution failed before a result artifact was written; consult the failed step logs. No successful provider/check outcome is inferred.'}, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: content-review-paid-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/content-review-paid/result.json
          if-no-files-found: error
          retention-days: 30
