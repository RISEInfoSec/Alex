name: Completed review decisions release
on:
  push:
    branches: [main]
    paths:
      - 'config/content_review_releases/2026-10-28-completed-reviews.json'
permissions:
  contents: write
concurrency:
  group: pipeline
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_completed_reviews.py tests/test_content_review_release.py
      - name: Apply only explicitly authorized papers
        run: |
          python -m alex.pipelines.apply_completed_reviews \
            --manifest config/content_review_releases/2026-10-28-completed-reviews.json --write
      - name: Publish updated corpus
        run: python -m alex.cli publish --record-collection
      - run: python scripts/stage_site.py
      - name: Save approved corpus and release receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research sitemap.xml
          git add data/accepted_classified.csv data/osint_cyber_papers.csv data/papers.json data/collection_status.json data/content_review_release_receipts/2026-10-28-completed-reviews.json data/content_review_release_receipts/2026-10-28-final-approvals.json
          git diff --cached --quiet || git commit -m "Apply 490 reviewed removals and eight validated approvals"
          git push
