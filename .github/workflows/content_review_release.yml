name: Content Review approved release
on:
  pull_request:
    paths:
      - 'config/content_review_releases/2026-11-01-discovery-backlog.json'
      - 'scripts/release_discovery_backlog.py'
      - 'tests/test_discovery_backlog_release.py'
  push:
    branches: [main]
    paths:
      - 'config/content_review_releases/2026-11-01-discovery-backlog.json'
permissions:
  contents: write
concurrency:
  group: pipeline
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt jsonschema
      - run: python -m pytest -q tests/test_content_review_release.py tests/test_discovery_backlog_release.py
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install jsonschema
      - run: python -m pytest -q tests/test_content_review_release.py tests/test_discovery_backlog_release.py
      - name: Validate each source and release eligible peers independently
        env:
          PYTHONPATH: .
        run: python scripts/release_discovery_backlog.py
      - name: Publish updated corpus
        run: python -m alex.cli publish --record-collection
      - run: python scripts/stage_site.py
      - name: Save approved corpus and release receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research sitemap.xml
          git add data/accepted_classified.csv data/osint_cyber_papers.csv data/papers.json data/collection_status.json data/content_review_release_receipts/2026-11-01-discovery-backlog.json
          git diff --cached --quiet || git commit -m "Publish eligible Discovery backlog with individual source holds"
          git push
      - name: Snapshot all live pipeline states for the itemized audit
        run: |
          git fetch --depth=1 origin pipeline-state
          python scripts/snapshot_discovery_backlog.py
          git fetch origin codex/discovery-release-20261101
          git worktree add /tmp/alex-discovery-audit-output origin/codex/discovery-release-20261101
          mkdir -p /tmp/alex-discovery-audit-output/audit
          cp -R audit/discovery-20261101 /tmp/alex-discovery-audit-output/audit/
          git -C /tmp/alex-discovery-audit-output add audit
          git -C /tmp/alex-discovery-audit-output commit -m "Preserve bounded live Discovery audit snapshots"
          git -C /tmp/alex-discovery-audit-output push origin HEAD:refs/heads/codex/discovery-release-20261101
