name: OpenAI smoketest
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoketest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          OPENAI_API_KEY: ${{ secrets.OPEN_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
        run: |
          python - <<'PYCODE'
          import json, os
          from tools.content_review.paid_worker import strict_classify, new_usage, PaidStageError
          sample = {
              "title": "A Survey of Advanced Persistent Threats: Attribution and Detection Techniques",
              "abstract": "We review techniques for detecting and attributing APT campaigns, focusing on threat intelligence sharing, IOC analysis, and malware reverse-engineering.",
              "venue": "IEEE Security & Privacy",
              "authors": "Researcher A; Researcher B",
          }
          usage = new_usage()
          try:
              result = strict_classify(sample, os.environ["OPENAI_MODEL"], usage)
              print(json.dumps({"status": "passed", "result": result}))
          except PaidStageError as exc:
              print(json.dumps({"status": "held", "error": str(exc)}))
              raise SystemExit(1)
          finally:
              print("OpenAI reported usage:", json.dumps(usage))
          PYCODE
