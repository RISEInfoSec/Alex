name: Prepare approved homepage refresh
on:
  push:
    branches: [codex/approved-homepage-refresh]
    paths: ['config/homepage_refresh_request.json']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/approved-homepage-refresh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Regenerate static collection footers from approved homepage
        run: python -m alex.collections
      - run: python scripts/stage_site.py
      - name: Verify corpus is unchanged
        run: git diff --exit-code -- data
      - name: Save generated collection pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A research sitemap.xml
          git diff --cached --quiet || git commit -m 'Regenerate collection footers for approved homepage'
          git push
