name: Citation chain
on:
  workflow_dispatch:
    inputs:
      identity_only:
        description: 'Verify the private coordinator connection without provider requests or data writes'
        required: false
        default: false
        type: boolean
      verify_literal_titles:
        description: 'Read-only verification of three previously rejected title queries; no candidate processing'
        type: boolean
        default: false
env:
  ALEX_OPENALEX_STATE_PATH: data/discovery_openalex_state.json
permissions:
  contents: write
# Shares the Pipeline's group: these jobs read and write the same
# pipeline-state branch, so a manual run must not interleave with it.
concurrency:
  group: pipeline
  cancel-in-progress: false
jobs:
  identity:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.identity_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pin the diagnostic and source heads
        shell: bash
        run: |
          test "$(git hash-object --no-filters scripts/openalex_writer_identity_probe.py)" = '64a8fb2f7f3b5c37ed29f1c180a36661591159c5'
          head="$(git rev-parse HEAD)"
          test "$head" = "$GITHUB_SHA"
          state="$(git ls-remote --exit-code origin refs/heads/pipeline-state)"
          [[ "$state" =~ ^([0-9a-f]{40})[[:space:]]refs/heads/pipeline-state$ ]]
          printf 'ALEX_CHECKOUT_HEAD=%s\n' "$head" >> "$GITHUB_ENV"
          printf 'ALEX_PIPELINE_STATE_HEAD=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
      - name: Verify the private coordinator identity
        env:
          ALEX_SITE_SERVICE_BEARER: ${{ secrets.ALEX_SITE_SERVICE_BEARER }}
        run: python -I scripts/openalex_writer_identity_probe.py
  chain:
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && !inputs.identity_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.verify_literal_titles && github.sha || 'main' }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - id: pipeline_state
        run: scripts/state.sh pull
      - name: Fence citation attempt
        id: citation_fence
        if: ${{ !inputs.verify_literal_titles }}
        run: |
          python scripts/citation_guard.py begin
          scripts/state.sh push "Fence citation attempt"
          python scripts/citation_guard.py acknowledge
      - if: ${{ !inputs.verify_literal_titles }}
        id: citation_chain
        env:
          HARVEST_MAILTO: ${{ secrets.HARVEST_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          python -m alex.cli chain
      - name: Verify literal title queries
        if: ${{ inputs.verify_literal_titles }}
        env:
          HARVEST_MAILTO: ${{ secrets.HARVEST_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python -m scripts.verify_openalex_titles
      - name: Retain citation response evidence
        id: citation_evidence
        if: ${{ always() && steps.citation_chain.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: citation-responses-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/citation_response_evidence-*.jsonl
          if-no-files-found: error
      - name: Retain staged citation output
        if: ${{ always() && steps.citation_chain.outcome == 'failure' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: citation-staged-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/.citation-*.tmp
          include-hidden-files: true
          if-no-files-found: warn
      - name: Preserve completed candidates and provider cooldown
        if: ${{ always() && steps.pipeline_state.outcome == 'success' && steps.citation_chain.outcome == 'success' && steps.citation_evidence.outcome == 'success' }}
        run: |
          python scripts/citation_guard.py complete
          scripts/state.sh push "Preserve chain state and provider cooldown"
      - name: Preserve provider cooldown after incomplete chain
        if: ${{ always() && steps.pipeline_state.outcome == 'success' && (inputs.verify_literal_titles || steps.citation_fence.outcome == 'success') && (steps.citation_chain.outcome != 'success' || steps.citation_evidence.outcome != 'success') }}
        run: scripts/state.sh push-provider "Preserve provider cooldown after incomplete chain"
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ always() && inputs.verify_literal_titles }}
        with:
          name: openalex-title-verification-${{ github.run_id }}
          path: .cache/openalex-title-verification.json
