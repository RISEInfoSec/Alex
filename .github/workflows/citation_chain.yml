name: Citation chain
on:
  workflow_dispatch:
    inputs:
      verify_literal_titles:
        description: 'Read-only verification of three previously rejected title queries; no candidate processing'
        type: boolean
        default: false
env:
  ALEX_OPENALEX_STATE_PATH: data/discovery_openalex_state.json
permissions:
  contents: write
# Shares the Pipeline's group: these jobs read and write the same
# pipeline-state branch, so a manual run must not interleave with it.
concurrency:
  group: pipeline
  cancel-in-progress: false
jobs:
  chain:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.verify_literal_titles && github.sha || 'main' }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - id: pipeline_state
        run: scripts/state.sh pull
      - name: Fence citation attempt
        id: citation_fence
        if: ${{ !inputs.verify_literal_titles }}
        run: |
          python scripts/citation_guard.py begin
          scripts/state.sh push "Fence citation attempt"
      - if: ${{ !inputs.verify_literal_titles }}
        id: citation_chain
        env:
          HARVEST_MAILTO: ${{ secrets.HARVEST_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          python -m alex.cli chain
      - name: Verify literal title queries
        if: ${{ inputs.verify_literal_titles }}
        env:
          HARVEST_MAILTO: ${{ secrets.HARVEST_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python -m scripts.verify_openalex_titles
      - name: Retain citation response evidence
        id: citation_evidence
        if: ${{ always() && steps.citation_chain.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: citation-responses-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/citation_response_evidence-*.jsonl
          if-no-files-found: error
      - name: Retain staged citation output
        if: ${{ always() && steps.citation_chain.outcome == 'failure' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: citation-staged-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/.citation-*.tmp
          include-hidden-files: true
          if-no-files-found: warn
      - name: Preserve completed candidates and provider cooldown
        if: ${{ always() && steps.pipeline_state.outcome == 'success' && steps.citation_chain.outcome == 'success' && steps.citation_evidence.outcome == 'success' }}
        run: |
          python scripts/citation_guard.py complete
          scripts/state.sh push "Preserve chain state and provider cooldown"
      - name: Preserve provider cooldown after incomplete chain
        if: ${{ always() && steps.pipeline_state.outcome == 'success' && (inputs.verify_literal_titles || steps.citation_fence.outcome == 'success') && (steps.citation_chain.outcome != 'success' || steps.citation_evidence.outcome != 'success') }}
        run: scripts/state.sh push-provider "Preserve provider cooldown after incomplete chain"
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ always() && inputs.verify_literal_titles }}
        with:
          name: openalex-title-verification-${{ github.run_id }}
          path: .cache/openalex-title-verification.json
