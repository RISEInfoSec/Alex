name: Citation chain
on:
  workflow_dispatch:
    inputs:
      verify_literal_titles:
        description: 'Read-only verification of three previously rejected title queries; no candidate processing'
        type: boolean
        default: false
env:
  ALEX_OPENALEX_STATE_PATH: data/discovery_openalex_state.json
permissions:
  contents: write
# Shares the Pipeline's group: these jobs read and write the same
# pipeline-state branch, so a manual run must not interleave with it.
concurrency:
  group: pipeline
  cancel-in-progress: false
jobs:
  chain:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.verify_literal_titles && github.sha || 'main' }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - id: pipeline_state
        run: scripts/state.sh pull
      - if: ${{ !inputs.verify_literal_titles }}
        env:
          HARVEST_MAILTO: ${{ secrets.HARVEST_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          python -m alex.cli chain
      - name: Verify literal title queries
        if: ${{ inputs.verify_literal_titles }}
        env:
          HARVEST_MAILTO: ${{ secrets.HARVEST_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python -m scripts.verify_openalex_titles
      - name: Preserve candidates and provider cooldown
        if: ${{ always() && steps.pipeline_state.outcome == 'success' }}
        run: scripts/state.sh push "Preserve chain state and provider cooldown"
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ always() && inputs.verify_literal_titles }}
        with:
          name: openalex-title-verification-${{ github.run_id }}
          path: .cache/openalex-title-verification.json
