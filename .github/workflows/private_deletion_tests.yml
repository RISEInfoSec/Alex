name: Private deletion safety checks
on:
  pull_request:
    paths:
      - 'scripts/publish_private_deletion.py'
      - 'tests/test_private_deletion_publication.py'
      - '.github/workflows/private_deletion*.yml'
      - '.github/workflows/pages.yml'
      - 'scripts/stage_site.py'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_private_deletion_publication.py -v
