name: Cancel owner-maintenance continuation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cancel_owner_maintenance.yml']
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel exact superseded continuation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_id=42113903650
          status=$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq .status)
          if [ "$status" != completed ]; then
            gh api --method POST "repos/$GH_REPO/actions/runs/$run_id/force-cancel"
          fi
