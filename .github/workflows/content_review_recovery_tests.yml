permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt pypdf beautifulsoup4
      - run: python -m tools.content_review.runtime_guard --check-dependencies
      - run: python -m pytest -q tests/test_content_review_runtime_guard.py tests/test_content_review_operations.py
      - run: python -m pytest -q tests/test_content_review_corpus_audit_live_check.py
      - run: python -m pytest -q tests/test_content_review_quality_hold_rules.py
      - run: python -m pytest -q tests/test_content_review_quality_lower_bound.py
      - run: python -m pytest -q tests/test_content_review_quality_source_eligibility.py
      - run: python -m pytest -q tests/test_content_review_source_unresolved.py
      - run: python -m pytest -q tests/test_content_review_coordinator_source_pilot.py
      - run: node --test tests/test_content_review_d1_fence_service.mjs tests/test_content_review_d1_fence_status.mjs tests/test_content_review_d1_write_fence.mjs tests/test_content_review_d1_reader.cjs tests/test_content_review_site_d1_reader.cjs tests/test_content_review_site_snapshot_service.mjs tests/test_content_review_d1_fingerprint.cjs tests/test_content_review_d1_live_fence.cjs tests/test_content_review_github_atomic_checkpoint.cjs tests/test_content_review_github_site_api.cjs tests/test_content_review_github_atomic_lease.cjs tests/test_content_review_github_atomic_heartbeat.cjs tests/test_content_review_github_atomic_monitor.cjs tests/test_content_review_github_read_heartbeat.cjs
      - run: node --test tests/test_content_review_lease_semantics.cjs tests/test_content_review_site_worker_services.mjs tests/test_content_review_stream_hash.cjs tests/test_content_review_site_duplicate_audit.mjs tests/test_content_review_site_heartbeat_keeper.mjs tests/test_content_review_site_actions_artifact.mjs tools/content_review/site_console/tests/*.test.mjs
      - run: python -m pytest -q tests/test_content_review_lease_semantics_compat.py tests/test_content_review_soups_intake.py tests/test_content_review_soups_intake_guard.py tests/test_content_review_soups_site_guard.py tests/test_content_review_soups_intake_writer.py tests/test_content_review_soups_intake_d1_integration.py tests/test_content_review_run_no_work_guard.py tests/test_content_review_site_no_work_writer.py tests/test_content_review_no_work_d1_integration.py tests/test_content_review_site_worker_client.py tests/test_content_review_conservative_identity.py tests/test_content_review_stream_csv.py tests/test_content_review_site_duplicate_semantics.py tests/test_content_review_site_duplicate_writer.py tests/test_content_review_site_duplicate_d1_integration.py tests/test_content_review_site_apwg_adapter.py tests/test_content_review_site_run_complete_guard.py tests/test_content_review_site_checkpoint_readback.py tests/test_content_review_site_run_complete_writer.py tests/test_content_review_site_run_complete_end_to_end.py tests/test_content_review_site_run_complete_d1_integration.py tests/test_content_review_site_source_request_guard.py tests/test_content_review_site_source_request_writer.py tests/test_content_review_site_source_request_d1_integration.py tests/test_content_review_site_source_result_guard.py tests/test_content_review_site_source_result_writer.py tests/test_content_review_site_source_result_d1_integration.py tests/test_content_review_site_source_retention_guard.py tests/test_content_review_site_source_retention_writer.py tests/test_content_review_site_source_retention_d1_integration.py tests/test_content_review_coordinator_heartbeat.py tests/test_content_review_coordinator_heartbeat_transport.py tests/test_content_review_coordinator_duplicate.py tests/test_content_review_coordinator_lifecycle.py tests/test_content_review_coordinator_cycle.py tests/test_content_review_coordinator_cli.py tests/test_content_review_virusbulletin_duplicate.py tests/t