name: Prepare record-link generated outputs
on:
  pull_request:
    paths:
      - '.github/workflows/prepare_record_outputs.yml'
permissions:
  contents: write
jobs:
  prepare:
    if: github.head_ref == 'codex/record-share-removal-flags'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - run: python -m alex.collections
      - uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const {execFileSync} = require('child_process');
            const paths = execFileSync('git', ['diff','--name-only','--','research','sitemap.xml'], {encoding:'utf8'}).trim().split('\n').filter(Boolean);
            const head = execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
            const commit = await github.rest.git.getCommit({...context.repo, commit_sha:head});
            let base = commit.data.tree.sha;
            for (let i=0; i<paths.length; i+=8) {
              const tree = paths.slice(i,i+8).map(path => ({path,mode:'100644',type:'blob',content:fs.readFileSync(path,'utf8')}));
              const result = await github.rest.git.createTree({...context.repo, base_tree:base, tree});
              base = result.data.sha;
            }
            core.info('GENERATED_TREE_SHA=' + base);
            core.info('GENERATED_FILE_COUNT=' + paths.length);
