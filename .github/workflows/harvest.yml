name: Harvest
on:
  workflow_dispatch:
    inputs:
      identity_only:
        description: 'Verify the private coordinator connection without provider requests or data writes'
        required: false
        default: false
        type: boolean
env:
  ALEX_HARVEST_SYNC: "1"
  ALEX_OPENALEX_STATE_PATH: data/discovery_openalex_state.json
permissions:
  contents: write
# Shares the Pipeline's group: these jobs read and write the same
# pipeline-state branch, so a manual run must not interleave with it.
concurrency:
  group: pipeline
  cancel-in-progress: false
jobs:
  identity:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.identity_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pin the diagnostic and source heads
        shell: bash
        run: |
          test "$(git hash-object --no-filters scripts/openalex_writer_identity_probe.py)" = '64a8fb2f7f3b5c37ed29f1c180a36661591159c5'
          head="$(git rev-parse HEAD)"
          test "$head" = "$GITHUB_SHA"
          state="$(git ls-remote --exit-code origin refs/heads/pipeline-state)"
          [[ "$state" =~ ^([0-9a-f]{40})[[:space:]]refs/heads/pipeline-state$ ]]
          printf 'ALEX_CHECKOUT_HEAD=%s\n' "$head" >> "$GITHUB_ENV"
          printf 'ALEX_PIPELINE_STATE_HEAD=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
      - name: Verify the private coordinator identity
        env:
          ALEX_SITE_SERVICE_BEARER: ${{ secrets.ALEX_SITE_SERVICE_BEARER }}
        run: python -I scripts/openalex_writer_identity_probe.py
  harvest:
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && !inputs.identity_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - id: pipeline_state
        run: scripts/state.sh pull
      - env:
          HARVEST_MAILTO: ${{ secrets.HARVEST_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          python -m alex.cli harvest
          git add data/accepted_harvested.csv
          git diff --cached --quiet || git commit -m "Harvest metadata"
          git push
      # Harvest's client performs initial, periodic and final state syncs.
      # Do not automatically retry a failed or ambiguous checkpoint push.
      - name: Retain harvest response evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: harvest-responses-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/harvest_response_cache*.jsonl
            data/harvest_response_cache*.uncertain
            data/.harvest-pending-*.csv
            data/.harvest-prior-*.csv
            data/discovery_openalex_state.json
          include-hidden-files: true
          if-no-files-found: warn
