name: Service connectivity check
on:
  push:
    branches: [codex/service-connectivity-check-20261112]
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify synthetic shared coordination
        env:
          SERVICE_TOKEN: ${{ secrets.ALEX_SITE_SERVICE_BEARER }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, sys, time, urllib.error, urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          token=os.environ.get('SERVICE_TOKEN','')
          if not token: raise SystemExit('service credential unavailable')
          scope='fixture_'+hashlib.sha256(token.encode()).hexdigest()[:32]
          request_id=hashlib.sha256(b'alex synthetic coordinator contention v1').hexdigest()
          url='https://alex-research-review.neil-schwartzm917549.chatgpt.site/api/provider-coordination-fixture'
          opener=urllib.request.build_opener(NoRedirect())
          def call(op,**kw):
              data=json.dumps({'op':op,'scope':scope,**kw}).encode()
              req=urllib.request.Request(url,data=data,headers={'OAI-Sites-Authorization':'Bearer '+token,'Content-Type':'application/json'},method='POST')
              with opener.open(req,timeout=20) as response: return json.load(response)
          try:
              deadline=1794502158
              if time.time()>=deadline: raise ValueError('missed_contention_window')
              time.sleep(max(0,deadline-time.time()))
              result=call('reserve',revision=0,request_id=request_id)
              if result.get('status') not in ('reserved','blocked'): raise ValueError('reserve_unconfirmed')
              verified=False
              for _ in range(45):
                  state=call('read',request_id=request_id)
                  evidence=state.get('evidence') or {}
                  if state.get('state',{}).get('phase')=='idle' and state['state'].get('attempts')==1 and evidence:
                      payload=evidence.get('payload')
                      digest=hashlib.sha256(json.dumps(payload,separators=(',',':')).encode()).hexdigest()
                      verified=payload=={'kind':'synthetic','request_id':request_id} and digest==evidence.get('sha256')
                      break
                  time.sleep(1)
              if not verified: raise ValueError('independent_readback_unconfirmed')
          except urllib.error.HTTPError as exc:
              print('synthetic check failed; HTTP',exc.code);sys.exit(1)
          except Exception as exc:
              print('synthetic check failed;',type(exc).__name__);sys.exit(1)
          print('synthetic coordination and independent readback verified')
          PY
