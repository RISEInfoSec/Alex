name: Flag an ALEX record for deletion
description: Request editorial review of a published record.
title: "[Removal review] "
body:
  - type: markdown
    attributes:
      value: "This request is public. Include only public information. A flag requests review; it does not delete a record."
  - type: input
    id: record-url
    attributes:
      label: Public ALEX record URL
      description: The direct link supplied by ALEX.
    validations:
      required: true
  - type: input
    id: record-title
    attributes:
      label: Record title
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason for deletion review
      description: Explain the problem and provide supporting evidence where available.
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirm review request
      options:
        - label: I am requesting editorial review of this record, and understand it remains published until a decision is made.
          required: true
